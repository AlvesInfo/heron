[project]
name = "heron"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Framework & serveur
    "django==3.2.25",
    "asgiref==3.5.0",  # importé directement (async_to_sync)
    "uvicorn==0.17.6",  # Procfile
    "supervisor==4.2.4",  # supervisor.conf (loops d'import sur le serveur)
    "python-decouple==3.6",
    "psycopg2-binary==2.9.5",
    "sqlparse==0.4.2",  # importé directement
    # --- Apps Django tierces (INSTALLED_APPS)
    "django-axes==5.31.0",
    "django-celery-beat==2.2.1",
    "django-celery-results==2.2.0",
    "django-chartjs==2.3.0",  # fournit le module chartjs ; le paquet chartjs==1.2 écrasait ses fichiers
    "django-ckeditor==6.2.0",
    "django-clamd==0.4.0",  # settings production
    "django-crispy-forms==1.14.0",
    "crispy-forms-semantic-ui==0.2.0",
    "django-dynamic-preferences==1.12.0",
    "django-eventstream==4.5.1",
    "django-extensions==3.1.5",
    "django-filter==21.1",
    "djangorestframework==3.13.1",
    # --- Tâches
    "celery==5.2.7",
    "flower==1.0.0",  # Procfile
    "redis==3.5.3",
    # --- Validation
    "pydantic==1.9.0",
    "djantic==0.5.0",
    "email-validator==1.1.3",  # pydantic.EmailStr
    # --- Fichiers : Excel, PDF, HTML, mails
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "xlsxwriter==3.2.2",
    "xlrd==2.0.1",  # pandas engine xlrd
    "python-calamine==0.3.1",  # pandas engine calamine
    "pdfrw==0.4",
    "weasyprint==64.0",
    "beautifulsoup4==4.10.0",
    "lxml==4.9.2",
    "html2text==2020.1.16",
    "chardet==4.0.0",
    "google-api-python-client==2.156.0",  # API Gmail (apps/invoices/bin/api_gmail)
    "google-auth==2.37.0",
    "google-auth-oauthlib==1.2.1",
    "dkimpy==1.1.4",
    "pyyaml==6.0",
    "requests==2.27.1",
    # --- Dates & SQL
    "pendulum==2.1.2",
    "python-dateutil==2.8.2",
    "sqlfluff==3.5.0",  # formatage SQL dans functions_postgresql
]

[tool.uv]
# Versions transitives figées au niveau d'avant le nettoyage du 2026-10-10 : la montée de
# versions se fera après la mise en place des tests (directive D6). À retirer à ce moment-là.
constraint-dependencies = [
    "google-api-core==2.24.0",
    "google-auth-httplib2==0.2.0",
    "googleapis-common-protos==1.66.0",
    "httplib2==0.31.0",
    "oauthlib==3.2.0",
    "proto-plus==1.26.1",
    "protobuf==5.29.5",
    "pyasn1==0.4.8",
    "pyasn1-modules==0.2.8",
    "pyparsing==3.0.7",
    "requests-oauthlib==1.3.1",
    "uritemplate==4.1.1",
]

[dependency-groups]
dev = [
    "pytest==7.1.1",
    "pytest-django==4.5.2",
    "pytest-cov==3.0.0",
    "coverage==7.6.12",
    "django-debug-toolbar==3.2.4",
    "black==22.1.0",
    "pylint==2.13.1",
    "pylint-django==2.5.3",
    "ruff==0.9.5",
]

[tool.pylint.main]
ignore-paths = ["apps/.*/migrations/.*", ".venv/.*"]
load-plugins = ["pylint_django"]
django-settings-module = "heron.settings.test"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages_control"]
# Désactivations auparavant répétées en tête de chaque module (# pylint: disable=...)
disable = [
    "E0401",  # import-error (résolu par l'environnement uv)
    "W1203",  # logging-fstring-interpolation
    "R0903",  # too-few-public-methods
    "W0702",  # bare-except (plus aucun dans le code, conservé pour les scripts)
    "E1101",  # no-member (faux positifs Django)
    "W0621",  # redefined-outer-name (fixtures pytest)
    "C0303",  # trailing-whitespace (SQL multi-lignes)
    "R0914",  # too-many-locals
    "R0913",  # too-many-arguments
    "C0413",  # wrong-import-position (amorçage django.setup() des scripts)
    "W0703",  # broad-except
    "W0718",  # broad-exception-caught
    "R0915",  # too-many-statements
    "C0415",  # import-outside-toplevel
    "R0912",  # too-many-branches
    "C0302",  # too-many-lines
    "R0901",  # too-many-ancestors
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "apps/*/tests/essais", "apps/*/essais", "heron/bin"]

[tool.ruff.lint]
# Règles proches de celles de SonarLint pour les tests (imports, paramètres et variables inutilisés,
# style pytest, simplifications) ; lancer : uv run ruff check conftest.py apps/*/tests
select = ["F", "E", "W", "B", "PT", "SIM", "ARG", "PLW", "PLC", "N", "UP", "RET", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Fixtures demandées pour leur effet de bord et callbacks factices : paramètres volontairement inutilisés
"conftest.py" = ["ARG001"]
"apps/*/tests/*" = ["ARG001", "ARG002", "ARG005", "SIM117"]
"apps/parameters/tests/test_counters_parameters.py" = ["E402"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "heron.settings.test"
# Suites couvertes à 100 % : `uv run pytest --cov` les lance toutes.
# Pour une seule app, restreindre aussi la mesure : `uv run pytest apps/accountancy/tests --cov=apps/accountancy`
testpaths = [
    "apps/accountancy/tests",
    "apps/articles/tests",
    "apps/book/tests",
    "apps/centers_clients/tests",
    "apps/centers_purchasing/tests",
    "apps/compta/tests",
    "apps/core/tests",
    "apps/countries/tests",
    "apps/data_flux/tests",
    "apps/edi/tests",
    "apps/formations/tests",
    "apps/groups/tests",
    "apps/import_files/tests",
    "apps/invoices/tests",
    "apps/od/tests",
    "apps/parameters/tests",
    "apps/rfa/tests",
    "apps/periods/tests",
    "apps/permissions/tests",
    "apps/traces/tests",
    "apps/users/tests",
    "apps/validation_purchases/tests",
    "apps/validation_sales/tests",
    "heron/tests",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--no-migrations --reuse-db -p no:cacheprovider --strict-markers"
markers = [
    "integration: tests traversant réellement la chaîne data_flux (lecture fichier, validation, upsert)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:axes",
]

[tool.coverage.run]
branch = true
source = [
    "apps/accountancy",
    "apps/book",
    "apps/centers_clients",
    "apps/centers_purchasing",
    "apps/articles",
    "apps/edi",
    "apps/formations",
    "apps/groups",
    "apps/import_files",
    "apps/compta",
    "apps/core",
    "apps/countries",
    "apps/data_flux",
    "apps/invoices",
    "apps/od",
    "apps/parameters",
    "apps/rfa",
    "apps/periods",
    "apps/permissions",
    "apps/traces",
    "apps/users",
    "apps/validation_purchases",
    "apps/validation_sales",
    "heron",
]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "heron/settings/*",
    "heron/bin/*",
    "heron/env/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
