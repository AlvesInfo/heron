# Configuration SonarQube du projet Héron
#
# NB : si vous analysez via le scanner CLI/CI, définissez aussi :
#   sonar.projectKey=<clé du projet côté SonarQube>
#   sonar.sources=.
# (SonarLint dans l'IDE ne lit pas ce fichier : les exclusions se règlent côté serveur
#  en mode connecté, ou en marquant les signalements "Ne pas corriger".)

# Gabarits PDF WeasyPrint : jamais servis au navigateur (rendu de factures clients).
# Les règles d'accessibilité web (th manquants, attributs dépréciés, ...) n'ont pas de
# sens ici et une modification du HTML changerait le rendu contractuel des factures.
sonar.exclusions=**/templates/invoices/pdf_*.html
