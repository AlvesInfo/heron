{% extends "heron/table_courant.html" %}

{% block table %}

<div class="four wide column"></div>

<div class="eight wide column">

    <table id="table_document"
           class="ui celled table"
           style="font-size: 12px !important;text-align: center;font-weight: 900;">
        <thead>
            <tr>
                <th scope="col" style="width: 5%">Edit</th>
                <th scope="col" style="width: 90%;text-align: left;">Axe PRO</th>
                <th scope="col" style="width: 5%">delete</th>
            </tr>
        </thead>
        <tbody>
        {% for parameter in rfa_parameters %}
            <tr id="id_{{ forloop.counter }}" class="hide_plans">
                <td>
                    <a href="{% url 'rfa:section_pro_exclusion_update' pk=parameter.pk%}">
                        <i class="edit icon modification"></i>
                    </a>
                </td>
                <td style="text-align: left;">{{parameter.axe_pro}}</td>
                <td class="tdDelete" style="text-align: center;">
                    <div style="cursor: pointer;">
                      <button type="button" style="background: none; border: 0; padding: 0; margin: 0; cursor: pointer; color: inherit; font: inherit;" aria-label="Supprimer" onclick="deletePk({{ forloop.counter }}, {{ parameter.pk }}, `{{ parameter.axe_pro }} - {{ parameter.axe_pro.section }}`, `{% url 'rfa:section_pro_exlusion_delete' %}`, `l'axe PRO à exclure`)"><i class="red trash icon" aria-hidden="true"></i></button>
                    </div>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>

</div>

<div class="two wide column"></div>

{% endblock table %}
